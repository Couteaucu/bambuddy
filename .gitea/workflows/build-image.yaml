---
name: Build BamBuddy Image

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build (e.g. 0.2.4-dev.1)'
        required: true

env:
  REGISTRY: gitea.revisionnet.net
  IMAGE: gitea.revisionnet.net/revision/bambuddy

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'upstream/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          else
            branch="${{ github.event.pull_request.head.ref }}"
            version="${branch#upstream/v}"
            git config user.name "Gitea Actions"
            git config user.email "actions@gitea.revisionnet.net"
            git tag "v${version}-rnet.1"
            git push origin "v${version}-rnet.1"
            echo "value=${version}-rnet.1" >> "$GITHUB_OUTPUT"
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: >-
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}${{
              steps.tag.outputs.push_latest == 'true' && format(',{0}:latest', env.IMAGE) || ''
            }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,ignore-error=true
