---
name: Build BamBuddy Image

on:
  push:
    tags:
      - 'v*-rnet.*'
  workflow_dispatch:

env:
  REGISTRY: gitea.revisionnet.net
  IMAGE: gitea.revisionnet.net/revision/bambuddy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Determine image version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # e.g. v0.2.3.2-rnet.2 -> 0.2.3.2-rnet.2
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Renovate PR merge: read APP_VERSION from source, append -rnet.1
            APP_VERSION=$(grep 'APP_VERSION' backend/app/core/config.py | grep -oP '"\K[^"]+')
            echo "value=${APP_VERSION}-rnet.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,ignore-error=true
