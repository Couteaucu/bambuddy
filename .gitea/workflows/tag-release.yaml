---
name: tag-release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'upstream/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create release tag
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          version="${branch#upstream/v}"
          tag="v${version}-rnet.1"

          git config user.name "Gitea Actions"
          git config user.email "actions@gitea.revisionnet.net"
          git tag "$tag"
          git push origin "$tag"
